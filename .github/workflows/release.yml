name: release-os

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # create releases / upload assets

jobs:
  # One job per flavor -> the builds run in parallel on separate runners
  # (each qemu-emulated arm/v7 build gets its own CPU). Each uploads its own
  # <flavor>-rootfs.tar.gz, which update.sh fetches per flavor.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [headless, gui, pocketchip]
    steps:
      - uses: actions/checkout@v4

      - name: Enable arm/v7 emulation
        uses: docker/setup-qemu-action@v3

      - name: Build ${{ matrix.flavor }} rootfs
        run: make ${{ matrix.flavor }}

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-rootfs
          path: ${{ matrix.flavor }}-rootfs.tar.gz

  # alpine isn't live-build-based (no shared armhf container / lb build), and
  # its kernel is its own ~45min-under-qemu build (x-chip-os/kernel), so it
  # gets its own job instead of joining the matrix above. The kernel apk is
  # cached (keyed on its build inputs) so an unrelated alpine/ or headless/
  # change doesn't pay that cost again.
  build-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable arm/v7 emulation
        uses: docker/setup-qemu-action@v3

      - name: Cache kernel apk
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: kernel/out
          key: alpine-kernel-${{ hashFiles('kernel/APKBUILD', 'kernel/nand.cfg', 'kernel/*.patch', 'kernel/Dockerfile', 'kernel/build-apk.sh') }}

      - name: Build linux-chip apk
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: make -C kernel

      - name: Build alpine rootfs
        run: make -C alpine

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs
          path: alpine/alpine-rootfs.tar.gz

  # Gather all flavors' artifacts into one tagged release so update.sh sees a
  # single "latest" os-<date> with every flavor's asset attached.
  release:
    needs: [build, build-alpine]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch built rootfs tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute version tag
        id: ver
        run: echo "tag=os-$(date -u +'%Y.%m.%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*-rootfs.tar.gz
          make_latest: true
