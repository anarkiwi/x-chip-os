# Kernelrelease/uname string == "$pkgver-chip" (APKBUILD's package() derives
# every install path -- /boot/vmlinuz-*, /lib/modules/* -- from `make -s
# kernelrelease`, so this must stay in sync with pkgver, not be edited alone).
CONFIG_LOCALVERSION="-chip"
CONFIG_LOCALVERSION_AUTO=n

# NAND/UBI + USB-gadget install-path config fragment for the CHIP -chip kernel,
# merged onto sunxi_defconfig via merge_config.sh + olddefconfig.
#
# This is the Alpine counterpart of x-chip-deb-repo/packages/x-chip-linux-deb/
# nand.cfg: NAND/MTD/UBI + the installer USB-gadget chain, plus DRM_SUN4I for
# the on-board composite TV output. The DIP HDMI/VGA add-on-board bridge chips
# (CH7033/dumb-vga-dac/simple-bridge/display-connector/i2c-gpio) from the
# Debian nand.cfg are deliberately left out -- those are for the pluggable DIP
# boards, not composite, which is native TCON1+tve and needs no bridge. Pull
# that section back in if a DIP alpine flavor is ever built (see docs/kernel.md).

CONFIG_MTD=y
CONFIG_MTD_CMDLINE_PARTS=y
# Parse the fixed-partitions (incl. the rootfs `slc-mode;` flag) straight from
# the device tree. Without this only cmdline mtdparts= works, and the DT
# partitions are silently ignored -> the whole chip shows up as one mtd.
CONFIG_MTD_OF_PARTS=y
CONFIG_MTD_RAW_NAND=y
CONFIG_MTD_NAND_SUNXI=y
CONFIG_MTD_UBI=y
CONFIG_MISC_FILESYSTEMS=y
CONFIG_UBIFS_FS=y

# AXP209 PMIC USB power-supply chain, BUILT-IN, so the module-less FEL
# installer initramfs can bring up usb0. sunxi_defconfig already ships these
# =y; pinned explicitly anyway so a defconfig refresh can't silently drop them
# (see x-chip-linux-deb's nand.cfg for the Debian/armmp regression this
# guards against -- same failure mode, different upstream base).
CONFIG_I2C=y
CONFIG_I2C_MV64XXX=y
CONFIG_MFD_AXP20X=y
CONFIG_MFD_AXP20X_I2C=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_AXP20X=y
CONFIG_IIO=y
CONFIG_AXP20X_ADC=y
CONFIG_AXP20X_POWER=y

# OTG musb (built-in) so the NAND installer initramfs can bring up a USB-network
# gadget. MUST be dual-role, not gadget-only (peripheral-only): the CHIP dts
# sets the usb_otg node to `dr_mode = "otg"`, and sunxi_musb.c only compiles
# the USB_DR_MODE_OTG case under the dual-role config below -- gadget-only
# hits the default branch and probe dies with "Invalid or missing 'dr_mode' property"
# (-EINVAL) -> no usb0. DUAL_ROLE also REQUIRES the USB host core built-in.
CONFIG_USB=y
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_SUNXI=y
CONFIG_USB_MUSB_DUAL_ROLE=y
CONFIG_PHY_SUN4I_USB=y
CONFIG_NOP_USB_XCEIV=y

# Gadget framework + configfs-composed RNDIS (what x-chip-tools/flash-live.sh's
# installer initramfs and the on-device init.sh builds).
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_U_ETHER=y

# RTL8723BS onboard wifi/bluetooth (connman needs a wifi interface to manage).
# WLAN is a menuconfig gate sunxi_defconfig leaves off entirely -- RTL8723BS
# is nested inside it, so without this line the symbol isn't just disabled,
# it's invisible to kconfig (silently dropped, not even "is not set").
CONFIG_WLAN=y
CONFIG_CFG80211=m
# CFG80211's `depends on RFKILL || !RFKILL` lets it build fine with RFKILL
# entirely absent, so this doesn't fail loudly -- but with no rfkill
# subsystem at all there's no /dev/rfkill or /sys/class/rfkill, and connman
# (which tracks/toggles radio block state through the kernel rfkill
# interface, separately from cfg80211) refuses to power on a technology it
# can't confirm isn't hardware-blocked -- surfaces as `connmanctl enable
# wifi` -> "Error wifi: Permission denied", even running as root. Found on
# hw 2026-09-10. Built-in (not =m): rfkill state needs to exist before
# connman starts, no reason to defer it to module autoload.
CONFIG_RFKILL=y

# r8723bs is NOT firmware-self-contained (despite being a staging driver --
# this was a wrong assumption earlier): it calls request_firmware() for
# rtlwifi/rtl8723bs_nic.bin at interface-up time. Confirmed on hw 2026-09-10:
# "Direct firmware load for rtlwifi/rtl8723bs_nic.bin failed with error -2",
# and every attempt to bring wlan0 up failed. Alpine's linux-firmware-rtlwifi
# package (added to alpine/build.sh) ships that file, but pre-compressed as
# .zst -- request_firmware can't use it without the kernel decompressing it
# first, which sunxi_defconfig doesn't enable.
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
CONFIG_MMC=y
CONFIG_MMC_SUNXI=y
CONFIG_RTL8723BS=m
CONFIG_BT=y
CONFIG_BT_HCIUART=m

# On-board composite TV output (TCON1 -> sun4i_tv -> the composite jack; no
# DIP/bridge chip involved, unlike the HDMI/VGA add-on boards). BUILT-IN so
# the kernel's own fbcon shows up on the composite output at boot, same as
# the Debian -chip kernel's console=tty0. sun4i_tv.o is compiled straight
# under DRM_SUN4I (no separate Kconfig symbol) -- see drivers/gpu/drm/sun4i/
# Makefile. DRM_SUN4I_BACKEND defaults to DRM_SUN4I's value but is pinned
# explicitly anyway: the Debian nand.cfg's history shows this default can get
# silently overridden by a base config that sets DRM_SUN4I=m elsewhere.
CONFIG_DRM=y
CONFIG_DRM_SUN4I=y
CONFIG_DRM_SUN4I_BACKEND=y

# DRM_SUN4I alone only gets the KMS driver probing/binding -- with no fbdev
# emulation layer, sunxi_defconfig leaves the VT stuck on CONFIG_DUMMY_CONSOLE
# (invisible), so u-boot's own composite text shows fine but the screen goes
# blank the moment Linux takes over: nothing ever binds a visible console to
# tty0/tty1, even though the DRM driver itself is probing correctly. Confirmed
# on hardware 2026-09-10 (u-boot text visible, kernel-stage blank). FB is the
# legacy fbdev core; DRM_FBDEV_EMULATION is DRM's fbdev-on-top-of-KMS client
# (registers /dev/fb0 backed by the DRM driver); FRAMEBUFFER_CONSOLE is fbcon
# itself, which binds text VTs onto that /dev/fb0. All three default-cascade
# from FB when olddefconfig resolves them, but pinned explicitly anyway --
# see the "silently demotes" rule at the top of this file's sibling docs.
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
